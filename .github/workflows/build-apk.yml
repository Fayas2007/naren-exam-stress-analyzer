name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        working-directory: mobile
        run: npm install

      - name: Prebuild Android project
        working-directory: mobile
        env:
          EXPO_PUBLIC_API_BASE_URL: https://exam-stress-analyzer-api.onrender.com
        run: npx expo prebuild --platform android --clean --no-install

      - name: Make Gradle Wrapper Executable
        working-directory: mobile/android
        run: chmod +x gradlew

      - name: Build Android Release APK with Gradle
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExamStressAnalyzer-Release-APK
          path: mobile/android/app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Exam Stress Analyzer Mobile App v1.0.0"
          body: |
            ## 📱 Exam Stress Analyzer - Android APK v1.0.0

            ### 🚀 Direct Download:
            Download and install the APK directly on your Android device:
            - **[app-release.apk](https://github.com/Fayas2007/naren-exam-stress-analyzer/releases/download/v1.0.0/app-release.apk)**

            ### ✨ What's included:
            - **Live Render Cloud Backend**: Connected to `https://exam-stress-analyzer-api.onrender.com`
            - **Dataset & Survey Analysis**: CSV, PDF, Word, PowerPoint psychometric stress computation
            - **Interactive Charts**: Stress distribution, subgroup comparisons, Pearson correlation matrix
            - **Gemini-Powered AI Copilot**: Sub-second statistical research assistant
            - **Publication-Ready PDF Reports**: Direct on-device export and sharing
          files: mobile/android/app/build/outputs/apk/release/app-release.apk
          token: ${{ secrets.GITHUB_TOKEN }}
