name: Build & Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        working-directory: mobile
        run: npm install --legacy-peer-deps

      - name: Prebuild Android project
        working-directory: mobile
        env:
          EXPO_PUBLIC_API_BASE_URL: https://exam-stress-analyzer-api.onrender.com
        run: npx expo prebuild --platform android --no-install

      - name: Make Gradle Wrapper Executable
        working-directory: mobile/android
        run: chmod +x gradlew

      - name: Build Android APK with Gradle
        working-directory: mobile/android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace || ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Find and Prepare APK for Release
        run: |
          mkdir -p release-artifacts
          find mobile/android/app/build/outputs/apk/ -type f -name "*.apk"
          APK_FILE=$(find mobile/android/app/build/outputs/apk/ -type f -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" release-artifacts/exam-stress-analyzer.apk
            echo "Successfully copied $APK_FILE to release-artifacts/exam-stress-analyzer.apk"
          else
            echo "Error: No APK found!" && exit 1
          fi
          ls -lh release-artifacts/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExamStressAnalyzer-APK
          path: release-artifacts/exam-stress-analyzer.apk

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Exam Stress Analyzer Mobile App v1.0.0"
          draft: false
          prerelease: false
          body: |
            ## 📱 Exam Stress Analyzer - Android APK v1.0.0

            ### 🚀 Direct Download & Install
            Click below to download the standalone APK directly onto your Android device:
            - 📥 **[exam-stress-analyzer.apk](https://github.com/Fayas2007/naren-exam-stress-analyzer/releases/download/v1.0.0/exam-stress-analyzer.apk)**

            ---

            ### 📋 Installation Guide for Android:
            1. Tap the direct download link above on your phone.
            2. When downloaded, tap the notification or open the APK from your **Downloads** folder.
            3. If prompted with *"For your security, your phone is not allowed to install unknown apps from this source"*, tap **Settings** and toggle **Allow from this source**.
            4. Tap **Install** and open the app!

            ---

            ### 🌟 Application Features:
            - **Cloud Backend Integration**: Live connection to `https://exam-stress-analyzer-api.onrender.com` (Neon PostgreSQL database).
            - **Multi-Format Ingestion**: Upload and analyze CSV, PDF, Word, and PowerPoint student survey files.
            - **Statistical & Psychometric Engine**: Cronbach's alpha, PSS-10 norm comparisons, stress level classifications (Low / Moderate / High).
            - **AI Stress Copilot**: Instant Gemini-powered conversational guidance and statistical interpretations.
            - **Interactive Visualizations**: Subgroup comparisons, correlation matrices, and stress distributions.
            - **PDF Export**: Generate and share comprehensive medical/academic stress reports directly from your phone.
          files: release-artifacts/exam-stress-analyzer.apk
          token: ${{ secrets.GITHUB_TOKEN }}
