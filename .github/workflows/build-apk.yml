name: Build & Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        working-directory: mobile
        run: npm install --legacy-peer-deps

      - name: Prebuild Android project
        working-directory: mobile
        env:
          EXPO_PUBLIC_API_BASE_URL: https://exam-stress-analyzer-api.onrender.com
        run: npx expo prebuild --platform android --no-install

      - name: Configure Phone Architectures in gradle.properties
        working-directory: mobile/android
        run: |
          sed -i 's/reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a,armeabi-v7a/g' gradle.properties

      - name: Make Gradle Wrapper Executable
        working-directory: mobile/android
        run: chmod +x gradlew

      - name: Build Android Release APK with Gradle
        working-directory: mobile/android
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare Release APK
        run: |
          mkdir -p release-artifacts
          cp mobile/android/app/build/outputs/apk/release/app-release.apk release-artifacts/exam-stress-analyzer.apk
          echo "Release APK verified and prepared."
          ls -lh release-artifacts/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExamStressAnalyzer-Release-APK
          path: release-artifacts/exam-stress-analyzer.apk

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Exam Stress Analyzer Mobile App v1.0.0"
          draft: false
          prerelease: false
          body: |
            ## 📱 Exam Stress Analyzer - Android Release APK v1.0.0

            ### 🚀 Direct Download & Install
            Click below to download the standalone Release APK directly onto your Android device:
            - 📥 **[exam-stress-analyzer.apk](https://github.com/Fayas2007/naren-exam-stress-analyzer/releases/download/v1.0.0/exam-stress-analyzer.apk)**

            ---

            ### 📋 Steps if you see "App not installed":
            1. **Uninstall Existing Versions**: If you have Expo Go or a previous draft of this app on your phone, uninstall it first to avoid signature conflicts.
            2. **Enable Unknown Apps**: Go to **Settings > Security / Privacy > Install unknown apps** and enable permission for your browser or File Manager.
            3. **Ensure Complete Download**: Make sure the file (`~180 MB`) completely finishes downloading before tapping to install.
            4. Tap **Install** and launch!

            ---

            ### 🌟 Application Features:
            - **Cloud Backend Integration**: Live connection to `https://exam-stress-analyzer-api.onrender.com` (Neon PostgreSQL database).
            - **Multi-Format Ingestion**: Upload and analyze CSV, PDF, Word, and PowerPoint student survey files.
            - **Statistical & Psychometric Engine**: Cronbach's alpha, PSS-10 norm comparisons, stress level classifications.
            - **AI Stress Copilot**: Instant Gemini-powered conversational guidance and statistical interpretations.
            - **Interactive Visualizations**: Subgroup comparisons, correlation matrices, and stress distributions.
            - **PDF Export**: Generate and share comprehensive medical/academic stress reports directly from your phone.
          files: release-artifacts/exam-stress-analyzer.apk
          token: ${{ secrets.GITHUB_TOKEN }}
