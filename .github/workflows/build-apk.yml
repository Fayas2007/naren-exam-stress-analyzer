name: Build & Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        working-directory: mobile
        run: npm install --legacy-peer-deps

      - name: Prebuild Android project
        working-directory: mobile
        env:
          EXPO_PUBLIC_API_BASE_URL: https://exam-stress-analyzer-api.onrender.com
        run: npx expo prebuild --platform android --no-install

      - name: Configure gradle.properties
        working-directory: mobile/android
        run: |
          sed -i 's/reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a,armeabi-v7a/g' gradle.properties
          sed -i 's/newArchEnabled=.*/newArchEnabled=false/g' gradle.properties

      - name: Embed Standalone JavaScript Bundle into Android Assets
        run: |
          mkdir -p mobile/android/app/src/main/assets
          cp mobile/assets/index.android.bundle mobile/android/app/src/main/assets/index.android.bundle
          echo "Verified embedded index.android.bundle:"
          ls -lh mobile/android/app/src/main/assets/

      - name: Make Gradle Wrapper Executable
        working-directory: mobile/android
        run: chmod +x gradlew

      - name: Build Standalone APK with Gradle
        working-directory: mobile/android
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace || ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Artifacts
        run: |
          mkdir -p release-artifacts
          if [ -f mobile/android/app/build/outputs/apk/release/app-release.apk ]; then
            cp mobile/android/app/build/outputs/apk/release/app-release.apk release-artifacts/exam-stress-analyzer.apk
            echo "Successfully prepared standalone release APK."
          elif [ -f mobile/android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp mobile/android/app/build/outputs/apk/debug/app-debug.apk release-artifacts/exam-stress-analyzer.apk
            echo "Successfully prepared standalone debug APK."
          fi
          ls -lh release-artifacts/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExamStressAnalyzer-Standalone-APK
          path: release-artifacts/exam-stress-analyzer.apk

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Exam Stress Analyzer Mobile App v1.0.0"
          draft: false
          prerelease: false
          body: |
            ## 📱 Exam Stress Analyzer - Standalone Android APK v1.0.0

            ### 🚀 Direct Download & Install
            Click below to download the 100% standalone APK (with offline bundled JS assets) directly onto your Android device:
            - 📥 **[exam-stress-analyzer.apk](https://github.com/Fayas2007/naren-exam-stress-analyzer/releases/download/v1.0.0/exam-stress-analyzer.apk)**

            ---

            ### 📋 Installation Guide:
            1. **Uninstall Previous Version**: If you installed the earlier test build, **uninstall it first** from your phone.
            2. **Download & Open**: Tap the download link above and open `exam-stress-analyzer.apk`.
            3. Tap **Install** and launch the app! It will open directly into the app dashboard without needing any dev server.

            ---

            ### 🌟 Application Features:
            - **100% Standalone Offline Bundled**: No Metro dev server or computer connection required.
            - **Cloud Backend Integration**: Live connection to `https://exam-stress-analyzer-api.onrender.com` (Neon PostgreSQL database).
            - **Multi-Format Ingestion**: Upload and analyze CSV, PDF, Word, and PowerPoint student survey files.
            - **Statistical & Psychometric Engine**: Cronbach's alpha, PSS-10 norm comparisons, stress level classifications.
            - **AI Stress Copilot**: Instant Gemini-powered conversational guidance and statistical interpretations.
            - **Interactive Visualizations**: Subgroup comparisons, correlation matrices, and stress distributions.
            - **PDF Export**: Generate and share comprehensive medical/academic stress reports directly from your phone.
          files: release-artifacts/exam-stress-analyzer.apk
          token: ${{ secrets.GITHUB_TOKEN }}
